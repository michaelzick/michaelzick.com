name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_ENV: test
  NEXT_PUBLIC_RECAPTCHA_SITE_KEY_V2: test-site-key
  RECAPTCHA_SECRET_KEY_V2: test-secret-key
  OPENAI_API_KEY: test-openai-key
  BREVO_SMTP_PASSWORD: test-brevo-password
  BREVO_USER: test-brevo-user
  BREVO_TO: test-to@example.com
  BREVO_FROM: test-from@example.com
  SITE_URL: https://www.michaelzick.com

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Agent brief sync
        run: npm run agent-briefs:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: PLAYWRIGHT_SKIP_BUILD=1 npm run test:e2e
